[project]
name = "fastapi-custom-template"
version = "0.1.0"
description = "遵循分层约束的 FastAPI 项目模板"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "celery>=5.5,<6",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tiny-struct-log",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
tiny-struct-log = { git = "https://github.com/HiRidgewalker/tiny-struct-log.git", tag = "V1.1.0" }
